<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101416">
  <meta name="description" content="A compact Mindustry Erekir production and logistics reference.">
  <link rel="icon" href="data:,">
  <title>Mindustry Cheatsheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="wordmark"><span></span> Mindustry Cheatsheet</div>
      <nav class="filters" aria-label="Reference section">
        <button class="filter is-active" data-filter="infrastructure">Infrastructure</button>
        <button class="filter" data-filter="turrets">Defence</button>
        <button class="filter" data-filter="units">Units</button>
      </nav>
      <label class="progression-filter" for="sector-filter">
        <span>Latest sector</span>
        <select id="sector-filter" aria-label="Latest Erekir sector captured"></select>
      </label>
    </header>

    <section class="block-grid" id="block-grid" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
