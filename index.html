<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101416">
  <meta name="description" content="A compact Mindustry Erekir and Serpulo reference.">
  <link rel="icon" href="data:,">
  <title>Mindustry Cheatsheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="wordmark"><span></span> Mindustry Cheatsheet - Erekir</div>
      <nav class="filters" aria-label="Reference section">
        <button class="filter is-active" data-filter="infrastructure">Infrastructure</button>
        <button class="filter" data-filter="turrets">Defence</button>
        <button class="filter" data-filter="units">Units</button>
      </nav>
      <div class="toolbar-actions">
        <label class="planet-filter" for="planet-filter">
          <span>Planet</span>
          <select id="planet-filter" aria-label="Planet">
            <option value="erekir" selected>Erekir</option>
            <option value="serpulo">Serpulo</option>
          </select>
        </label>
        <label class="progression-filter" for="sector-filter">
          <span>Latest sector</span>
          <select id="sector-filter" aria-label="Latest sector captured"></select>
        </label>
        <button class="download-button" id="download-button" type="button" title="Save the current cheatsheet view as a PNG">Download</button>
      </div>
    </header>

    <section class="block-grid" id="block-grid" aria-live="polite"></section>
  </main>

  <script src="serpulo-data.js"></script>
  <script src="assets/vendor/asset-data.js"></script>
  <script src="assets/vendor/html-to-image.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
